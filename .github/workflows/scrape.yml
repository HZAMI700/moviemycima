name: Scrape WeCima.bid

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to crawl'
        required: false
        default: '500'
        type: string
      max_depth:
        description: 'Max crawl depth'
        required: false
        default: '3'
        type: string
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          MAX_PAGES: ${{ inputs.max_pages || '500' }}
          MAX_DEPTH: ${{ inputs.max_depth || '3' }}
        run: |
          python -m scraper.crawler \
            --max-pages "$MAX_PAGES" \
            --max-depth "$MAX_DEPTH" \
            --output-dir client/public/data

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain client/public/data/)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated JSON files
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name 'wecima-scraper[bot]'
          git config --global user.email 'wecima-scraper[bot]@users.noreply.github.com'
          git add client/public/data/
          git commit -m "chore(data): auto-update scraped JSON files [skip ci]"
          git push
